# Example ZFS configuration for this image: kernel statistics, and pool health.
#
# inputs.zfs on Linux reads only /proc/spl/kstat/zfs — ARC, prefetch and
# per-pool I/O statistics, which every container sees as the node's. It runs no
# commands and needs no privileges. What it does not report on Linux is pool
# health and capacity, so the inputs.exec below asks the node's own `zpool
# list` for those.
#
# The image ships no ZFS: /usr/sbin/zpool leads to node-tool, which runs the
# node's own zpool, so the node needs the ZFS tools installed. The pod needs
# the node's /proc mounted at /hostfs/proc; see README.md, "What the consumer
# has to provide".

[[inputs.zfs]]
  ## Per-pool I/O statistics as well as the global ones.
  poolMetrics = true

  ## Fields as the types ZFS defines, to avoid overflows; the plugin itself
  ## strongly recommends it. Needs an output that supports unsigned integers.
  useNativeTypes = true

  interval = "1m"

[[inputs.exec]]
  ## Exactly the arguments node-tool allows for zpool: `list`, `-H` (no
  ## header, tab-separated), `-p` (exact numbers) and `-o` with column names.
  commands = ["/usr/sbin/zpool list -H -p -o name,health,size,alloc,free,fragmentation,capacity,dedupratio"]
  name_override = "zfs_pool"

  data_format = "csv"
  csv_delimiter = "\t"
  csv_header_row_count = 0
  csv_column_names = ["pool", "health", "size", "alloc", "free", "fragmentation", "capacity", "dedupratio"]
  csv_column_types = ["string", "string", "int", "int", "int", "int", "int", "float"]

  ## The pool's name is the `pool` tag, as inputs.zfs names it in the same
  ## zfs_pool measurement. Health is a tag too, not a string field: outputs
  ## that take numbers only, such as outputs.opentelemetry, drop string fields
  ## without an error, and pool health would silently never arrive. A change
  ## of state starts a new series, which alerting reads from the tag.
  csv_tag_columns = ["pool", "health"]

  ## zpool prints "-" for a value that does not apply, such as fragmentation
  ## on some pools. Skipped rather than failing the whole line.
  csv_skip_values = ["-"]

  ## Health is what matters here, and it can change quickly.
  interval = "1m"
  timeout = "10s"
