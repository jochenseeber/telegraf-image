# Example inputs.lvm configuration for this image.
#
# Reports physical volumes, volume groups and logical volumes: sizes, free
# space, and how full thin pools and snapshots are.
#
# The image ships no LVM: the paths below lead to node-tool, which runs the
# node's own pvs, vgs and lvs, so the node needs the LVM tools installed. The
# pod needs `privileged: true` and the node's /proc mounted at
# /hostfs/proc; see README.md, "What the consumer has to provide".

[[inputs.lvm]]
  ## Must stay false. This image carries no sudo: node-tool holds the
  ## capabilities LVM needs as file capabilities, so Telegraf — still the
  ## unprivileged `telegraf` user — runs it directly. Setting this true would
  ## look for a sudo that is not installed and fail every read.
  use_sudo = false

  ## The plugin's own defaults, which this image provides as links to
  ## node-tool. Spelled out so they are not rediscovered the hard way.
  pvs_binary = "/usr/sbin/pvs"
  vgs_binary = "/usr/sbin/vgs"
  lvs_binary = "/usr/sbin/lvs"

  ## Volume sizes change slowly, and every collection scans every disk's LVM
  ## label.
  interval = "5m"
