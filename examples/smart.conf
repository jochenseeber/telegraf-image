# Example inputs.smart configuration for this image.
#
# Use this one only if you need NVMe vendor-specific attributes, which come
# from `nvme-cli`. For plain SMART attributes prefer examples/smartctl.conf —
# see README.md, "Which plugin".
#
# The pod needs `privileged: true` and /dev mounted; see README.md,
# "What the consumer has to provide".

[[inputs.smart]]
  ## Both paths are the plugin's own defaults, and this image provides them as
  ## symlinks so they resolve. Alpine installs the real binaries under
  ## /usr/sbin; they are spelled out here anyway, because an explicit path is
  ## one less thing to rediscover when a future base image moves them.
  path_smartctl = "/usr/bin/smartctl"
  path_nvme = "/usr/bin/nvme"

  ## Required. Telegraf runs as the unprivileged `telegraf` user in this image;
  ## /etc/sudoers.d/telegraf grants it passwordless root for smartctl and nvme
  ## at both the /usr/sbin and /usr/bin paths. Without this the plugin runs the
  ## tools directly and every device read fails with a permission error.
  use_sudo = true

  ## The reason to choose this plugin over inputs.smartctl. Finds NVMe devices
  ## and enables the vendor-specific log pages their controllers expose. Set it
  ## to an explicit vendor list ("Intel", ...) to narrow what is collected.
  enable_extensions = ["auto-on"]

  ## Gathers every returned SMART attribute into smart_attribute, not just the
  ## summary. This is the detail most dashboards actually want — reallocated
  ## sectors, pending sectors, wear leveling.
  attributes = true

  ## Defaults to "standby", which skips disks that have spun down rather than
  ## waking them every interval. Keep it unless a disk's SMART data matters
  ## more than letting it sleep.
  nocheck = "standby"

  ## Distinguishes disks sitting behind the same controller, which matters on
  ## any node with a RAID HBA.
  tag_with_device_type = true

  ## Devices are auto-discovered via `smartctl --scan` and
  ## `smartctl --scan -d nvme`. Pin them explicitly if discovery picks up
  ## something it should not:
  # devices = ["/dev/sda", "/dev/nvme0"]
  # excludes = ["/dev/pass6"]

  ## Disks behind a RAID array may need their SMART data read one drive at a
  ## time; switch to "sequential" if concurrent reads come back empty.
  # read_method = "concurrent"

  ## SMART reads are slow on spinning disks, and there is nothing to gain from
  ## polling them often.
  interval = "5m"
  timeout = "30s"
