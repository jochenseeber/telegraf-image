# Example inputs.smart configuration for this image.
#
# Prefer examples/smartctl.conf. This plugin is the older one, and the only
# reason left to pick it is its metric and tag shape, which existing
# dashboards may be built on — see README.md, "Which plugin".
#
# The pod needs `privileged: true` and the node's /proc mounted
# at /hostfs/proc, and the node needs smartmontools; see README.md, "What the
# consumer has to provide".

[[inputs.smart]]
  ## The plugin's own default, which this image provides as a link to
  ## node-tool, which runs the node's own smartctl. Spelled out so it is not
  ## rediscovered the hard way.
  path_smartctl = "/usr/bin/smartctl"

  ## Must stay false. This image carries no sudo: node-tool holds the
  ## capabilities smartctl needs as file capabilities, so Telegraf — still the
  ## unprivileged `telegraf` user — runs it directly. Setting this true would
  ## look for a sudo that is not installed and fail every read.
  use_sudo = false

  ## `enable_extensions` is deliberately not set, and must stay unset: it
  ## shells out to `nvme`, which node-tool does not run. NVMe SMART still
  ## arrives through smartctl; only the vendor-specific log pages are
  ## unavailable. See README.md, "Capabilities, not sudo or root".

  ## Gathers every returned SMART attribute into smart_attribute, not just the
  ## summary. This is the detail most dashboards actually want — reallocated
  ## sectors, pending sectors, wear leveling.
  attributes = true

  ## Defaults to "standby", which skips disks that have spun down rather than
  ## waking them every interval. Keep it unless a disk's SMART data matters
  ## more than letting it sleep.
  nocheck = "standby"

  ## Distinguishes disks sitting behind the same controller, which matters on
  ## any node with a RAID HBA.
  tag_with_device_type = true

  ## Devices are auto-discovered via `smartctl --scan` and
  ## `smartctl --scan -d nvme`. Pin them explicitly if discovery picks up
  ## something it should not:
  # devices = ["/dev/sda", "/dev/nvme0"]
  # excludes = ["/dev/pass6"]

  ## Disks behind a RAID array may need their SMART data read one drive at a
  ## time; switch to "sequential" if concurrent reads come back empty.
  # read_method = "concurrent"

  ## SMART reads are slow on spinning disks, and there is nothing to gain from
  ## polling them often.
  interval = "5m"
  timeout = "30s"
