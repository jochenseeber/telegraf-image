# Example inputs.smartctl configuration for this image.
#
# This is the plugin to prefer. It reads NVMe devices through smartctl itself,
# which is why this image needs no nvme-cli. Use examples/smart.conf only if
# something already depends on that plugin's metric shape — see README.md,
# "Which plugin".
#
# The pod needs `privileged: true` and /dev mounted; see README.md,
# "What the consumer has to provide".

[[inputs.smartctl]]
  ## Where Alpine installs smartctl, and this plugin's own default. The image
  ## also symlinks /usr/bin/smartctl for inputs.smart, which defaults there;
  ## either path works, and a file capability is on the inode, so both carry
  ## the same privileges.
  path = "/usr/sbin/smartctl"

  ## Must stay false. This image carries no sudo: smartctl holds the
  ## capabilities it needs as file capabilities, so Telegraf — still the
  ## unprivileged `telegraf` user — runs it directly. Setting this true would
  ## look for a sudo that is not installed and fail every read.
  use_sudo = false

  ## Defaults to "standby", which skips disks that have spun down rather than
  ## waking them every interval. Keep it unless a disk's SMART data matters
  ## more than letting it sleep.
  no_check = "standby"

  ## Puts the device in the "name" tag and the attribute in its own "attribute"
  ## tag, so smartctl_attribute metrics can be joined to their device. Version 1
  ## is the default only for backwards compatibility.
  metric_version = 2

  ## SMART reads are slow on spinning disks, and there is nothing to gain from
  ## polling them often.
  interval = "5m"
  timeout = "30s"
