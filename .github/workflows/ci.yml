name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # The compiled binary, keyed by its version: compiling it is most of
      # this job's time, and a pinned version always compiles the same.
      - name: Restore actionlint
        id: actionlint
        uses: actions/cache@v6
        with:
          path: ~/go/bin/actionlint
          key: actionlint-v1.7.12-${{ runner.os }}-${{ runner.arch }}

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
          CACHED: ${{ steps.actionlint.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$CACHED" != true ]; then
            go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run rubocop and actionlint
        run: bundle exec rubocop && rake lint

  build:
    name: Build and verify ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      # Every job runs on an amd64 runner, so any other platform is built and
      # executed under emulation. That is slower than a native arm64 runner but
      # available on every repository, and the checks only run version-reporting
      # commands — nothing where emulation would change the answer.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # No Docker Hub login: the only image pulled here is the public Telegraf
      # base, which needs no credentials. Keeping the push token out of a
      # workflow that runs on every branch is worth more than insurance against
      # an anonymous pull limit this repository has never hit. If it ever does,
      # add a read-only login *before* the two actions above — they pull from
      # Docker Hub themselves, so a login after them protects nothing.
      # Build layers from earlier runs, chiefly the Rust toolchain and
      # node-tool's compile, which under emulation take most of the arm64 job.
      # Keyed by week as well as by what is built: the toolchain and the test
      # host's tools are unpinned Alpine packages, so a week-old cache is
      # dropped rather than testing against them for ever. Only here: the
      # release workflow builds from scratch, so what it publishes never rests
      # on a cached layer.
      - name: Name the build cache
        id: cache-key
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          echo "prefix=buildx-${PLATFORM//\//-}-$(date -u +%G-W%V)-" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: ${{ steps.cache-key.outputs.prefix }}${{ hashFiles('Dockerfile', 'node-tool/**', 'Rakefile') }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}

      - name: Build and verify
        env:
          IMAGE_PLATFORMS: ${{ matrix.platform }}
          IMAGE_BUILD_CACHE: ${{ runner.temp }}/buildx-cache
        run: rake image:build image:verify
